<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .blog-card {
        width: 400px;
        height: 250px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }

      .code-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(45deg, #48bb78, #38a169);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        color: white;
        font-size: 40px;
      }

      h2 {
        color: #2d3748;
        margin: 0 0 10px 0;
        font-size: 24px;
        line-height: 1.3;
      }

      .subtitle {
        color: #4a5568;
        font-size: 16px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="blog-card">
      <div class="code-icon">⚡</div>
      <h2>No-Code vs Traditional</h2>
      <div class="subtitle">When to use each approach</div>
    </div>
  </body>
</html>
